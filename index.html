function quota(b,s){if(b.name!=='即梦')return s[6];const token=s[1].split('/')[1].trim();return Math.round(parseFloat(token)*(token.endsWith('K')?1000:1))}
function quote(b,s){
 const [cycle,tier,first,months,actual,early,later]=s,base=quota(b,s);
 const renewal=renewals[[b.name,cycle,tier].join('|')]??first;
 const isRenew=$('purchase').value==='renew';
 const resolution=$('resolution').value,rate=b.rate[resolution];
 if(!rate || (isRenew && typeof renewal!=='number'))return null;
 const paid=isRenew?renewal:first,term=isRenew?months:actual;
 const points=isRenew||$('stage').value==='later'?later:early;
 const factor=resolution==='720'&&modelDiscount==='on'?b.off[cycle]||1:1;
 return {tier,qty:Math.floor(base/(5*b.rate[720])),cost:paid/term/points*rate*factor};
}

function drawPlot(period,visibleBrands,ref){
 const periodQuotes=visibleBrands.map(brand=>({
   brand,
   quotes:brand.plans.filter(plan=>plan[0]===period).map(plan=>quote(brand,plan)).filter(Boolean)
 })).filter(entry=>entry.quotes.length);
 visibleBrands=periodQuotes.map(entry=>entry.brand);
 const tiers=[];
 let low=1;
 for(const high of [...bounds,Infinity]){
   const label=high===Infinity?low+' 条及以上':low+'–'+high+' 条';
   const groups=periodQuotes.map(({quotes})=>quotes.filter(r=>r.qty>=low&&r.qty<=high).sort((a,b)=>a.cost-b.cost));
   const name=bounds.length===2?tierNames[tiers.length]:'产量 '+(tiers.length+1)+' 档';
   tiers.push({name,label,groups});low=high+1;

 const perRow=Math.max(1,Math.floor((width-70)/Math.max(150,visibleBrands.length*55)));
 for(let i=0;i<tiers.length;i+=perRow){

}
function drawPlotRow(period,visibleBrands,ref,tiers,width,top){

   if(content!==undefined)node.textContent=content;parent.append(node);return node;
 }

   groups.forEach((g,j)=>{
     if(!g.length)return;
     const x=start+9+(j+.5)*slot,c=g[0].cost,bw=Math.min(56,slot-6);
     const ratio=c/ref;
     const comparison=ratio<=1?(ratio*10).toFixed(2)+' 折':ratio.toFixed(2)+' 倍';
     const caption=visibleBrands[j].name+' · '+period+'付 · '+g[0].tier+' · '+g[0].qty+' 条/月';
     const message=caption+'\n单秒价格 ¥'+c.toFixed(3)+'/秒\n相对火山刊例 '+comparison;
     const node=svg('g',{class:'price-bar',tabindex:0,role:'button','aria-label':message,style:'cursor:pointer'});
     svg('rect',{x:x-bw/2,y:y(c),width:bw,height:base-y(c),rx:3,fill:palette[brands.indexOf(visibleBrands[j])]},undefined,node);
     svg('text',{x,y:(base+y(c))/2,'text-anchor':'middle','dominant-baseline':'central','font-weight':700,'font-size':Math.min(12,base-y(c),(bw-2)/4),fill:'#fff',stroke:'#263746','stroke-width':1.6,'paint-order':'stroke','pointer-events':'none'},visibleBrands[j].name,node);

     node.onpointermove=moveTip;
     node.onpointerleave=hidePriceTip;
     node.onfocus=()=>{
       const box=node.getBoundingClientRect();
       showPriceTip(message,box.right,box.top);
     };
     node.onblur=hidePriceTip;
     node.onclick=()=>{hidePriceTip();detail(visibleBrands[j].name,period+'付 · '+name+'（'+label+' / 月）',g)};
     node.onkeydown=e=>{

     };
   });
 });

}

 discountButtons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
 draw();
});
function apply(){const v=$('cuts').value.split(/[,，]/).map(s=>Number(s.trim()));if(v.length>12||v.some((n,i)=>!Number.isSafeInteger(n)||n<1||(i&&n<=v[i-1]))){$('error').textContent=' 请输入递增的正整数，最多 12 个上限。';return}bounds=v;$('error').textContent='';draw()}
$('apply').onclick=apply;$('cuts').onkeydown=e=>{if(e.key==='Enter')apply()};$('reset').onclick=()=>{$('cuts').value='30, 75';apply()};document.querySelectorAll('select').forEach(el=>el.onchange=draw);draw();
let previousPlotWidth=$('plots').clientWidth;
new ResizeObserver(()=>{
 const width=$('plots').clientWidth;
 if(width===previousPlotWidth)return;
 previousPlotWidth=width;
 draw();
}).observe($('plots'));
</script></html>
